<!--
  Auth email template: email_change

  The link must use the token_hash form. Supabase's default templates use
  {{ .ConfirmationURL }}, which points straight at the Auth server and skips
  /auth/confirm, so the application never gets to set its own cookies or honour
  the "next" destination.
-->
<h2>Confirm your new email address</h2>

<p>Confirm this address to finish changing the email on your account.</p>

<p>
	<a
		href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/organisations"
	>
		Confirm this address
	</a>
</p>

<p>If you did not request this, you can ignore this email — nothing will change.</p>
