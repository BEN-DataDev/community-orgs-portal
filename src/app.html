<!doctype html>
<html lang="en" data-theme="pine">
	<head>
		<meta charset="utf-8" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			/*
			 * Applies the stored colour mode before first paint. Without this the
			 * page renders in the wrong mode and then jumps when the client mounts.
			 * The key and the three values must match src/lib/theme.svelte.ts.
			 */
			(function () {
				var dark;
				try {
					var mode = localStorage.getItem('colorMode');
					dark =
						mode === 'dark' ||
						(mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				} catch (error) {
					dark = false;
				}
				document.documentElement.classList.toggle('dark', dark);
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
